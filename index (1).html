<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raise Independent Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --paper:#F5F7F3; --surface:#FFFFFF; --ink:#1E2940; --muted:#5B6578;
  --line:#DCE1DA; --sage:#6F917B; --sage-soft:#E3ECE5; --sun:#F2B705; --sun-soft:#FDF1C7;
  --cream:#FAF7F2; --gold:#C79A3B;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A24; --surface:#1B2330; --ink:#E9EDF3; --muted:#A3ADBD;
    --line:#2C3646; --sage:#8FB39B; --sage-soft:#1F2E28; --sun:#F5C53A; --sun-soft:#3A3217;
  }
}
:root[data-theme="dark"]{
  --paper:#141A24; --surface:#1B2330; --ink:#E9EDF3; --muted:#A3ADBD;
  --line:#2C3646; --sage:#8FB39B; --sage-soft:#1F2E28; --sun:#F5C53A; --sun-soft:#3A3217;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun); outline-offset:3px; border-radius:4px}
.wrap{max-width:1080px; margin:0 auto; padding:0 24px}

/* header */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
header.top .wrap{display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px}
.top-left{display:flex; align-items:center; gap:28px}
.home-logo{display:block; flex:none}
.home-logo img{display:block; width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px var(--line)}
nav.links{display:flex; gap:22px; font-size:15px; font-weight:500}
nav.links a{text-decoration:none; color:var(--muted)}
nav.links a:hover,nav.links a[aria-current="page"]{color:var(--ink)}
.ig-name{display:flex; align-items:center; gap:8px; text-decoration:none; font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:-.01em; white-space:nowrap}
.ig-name svg{width:20px; height:20px; flex:none}
.ig-name:hover span{text-decoration:underline; text-decoration-color:var(--sun); text-decoration-thickness:2px; text-underline-offset:4px}

/* hero */
.hero{padding:72px 0 56px; display:grid; grid-template-columns:1.25fr .75fr; gap:40px; align-items:end}
.hero h1{font-family:var(--display); font-weight:800; font-size:clamp(44px,8vw,96px); line-height:.95; letter-spacing:-.035em; margin:0}
.hero p{max-width:34ch; color:var(--muted); font-size:19px; margin:24px 0 0}
.hero-logo{justify-self:end; width:100%; max-width:300px; height:auto; aspect-ratio:1; border-radius:50%; background:#fff; box-shadow:0 18px 40px -24px rgba(30,41,64,.45); animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.hero-logo{animation:none}}

/* today */
.today{display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:2px solid var(--ink); border-bottom:1px solid var(--line)}
.today article{padding:32px 32px 36px 0}
.today article + article{padding-left:32px; padding-right:0; border-left:1px solid var(--line)}
.today .kicker{font-size:14px; font-weight:600; color:var(--sage); margin:0 0 10px}
.today .hack-k{color:#B38600}
:root[data-theme="dark"] .today .hack-k{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .today .hack-k{color:var(--sun)}}
.today h2{font-family:var(--display); font-size:clamp(24px,3vw,32px); line-height:1.15; letter-spacing:-.02em; margin:0 0 12px; font-weight:700}
.today p{margin:0; color:var(--muted); max-width:52ch}

/* sections */
section.block{padding:88px 0 0}
.block-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:32px; flex-wrap:wrap}
.block-head h2{font-family:var(--display); font-weight:800; font-size:clamp(32px,5vw,52px); letter-spacing:-.03em; margin:0; line-height:1}
.block-head p{margin:0; color:var(--muted); max-width:40ch}

/* tips */
.tips{list-style:none; margin:0; padding:0}
.tip{display:grid; grid-template-columns:120px 1fr; gap:24px; padding:28px 0; border-top:1px solid var(--line)}
.tip.has-img{grid-template-columns:120px 1fr 260px}
.tip .pic{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px; display:block; background:var(--sage-soft)}
.today .pic{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:16px; display:block; margin:0 0 20px; background:var(--sage-soft)}
.hack .pic{max-width:none; width:calc(100% + 48px); margin:-24px -24px 18px; aspect-ratio:16/9; object-fit:cover; display:block; border-radius:18px 18px 0 0}
.tip time{font-size:14px; color:var(--muted); padding-top:6px}
.tip h3{font-family:var(--display); font-size:24px; font-weight:700; letter-spacing:-.015em; margin:0 0 8px; line-height:1.2}
.tip p{margin:0; max-width:64ch}
.more{margin-top:8px; background:none; border:1px solid var(--line); color:var(--ink); font:600 15px var(--body); padding:12px 20px; border-radius:999px; cursor:pointer}
.more:hover{border-color:var(--ink)}

/* hacks */
.hacks{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px}
.hack{background:var(--surface); border-radius:18px; padding:24px; border:1px solid var(--line); position:relative; overflow:hidden}
.hack:nth-child(3n+1){background:var(--sun-soft); border-color:transparent}
.hack h3{font-family:var(--display); font-size:20px; font-weight:700; margin:0 0 8px; line-height:1.2; letter-spacing:-.01em}
.hack p{margin:0; font-size:16px; color:var(--muted)}
.hack time{display:block; font-size:13px; color:var(--muted); margin-top:14px}

/* instagram */
.grams{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.gram{aspect-ratio:1; border-radius:14px; padding:22px; display:flex; flex-direction:column; justify-content:space-between; text-decoration:none; overflow:hidden; background:var(--sage-soft)}
.gram:nth-child(4n+2){background:var(--ink); color:var(--paper)}
.gram:nth-child(4n+3){background:var(--sun-soft)}
.gram:nth-child(4n+4){background:var(--surface); border:1px solid var(--line)}
.gram .fmt{font-size:13px; font-weight:600; opacity:.7}
.gram h3{font-family:var(--display); font-weight:700; font-size:clamp(18px,2.2vw,26px); line-height:1.1; letter-spacing:-.02em; margin:0}
.gram p{margin:8px 0 0; font-size:14px; line-height:1.45; opacity:.8; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.follow{display:inline-block; margin-top:24px; font-weight:600; text-decoration:none; border-bottom:2px solid var(--sun); padding-bottom:2px}

/* about page */
.about{padding:72px 0 0}
.umbrella img{display:block; width:260px; height:auto}
:root[data-theme="dark"] .umbrella img{filter:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .umbrella img{filter:invert(1) hue-rotate(180deg)}}
.about h1{font-family:var(--display); font-weight:800; font-size:clamp(40px,7vw,80px); line-height:.95; letter-spacing:-.035em; margin:40px 0 0}
.about .lede{font-size:21px; max-width:46ch; margin:24px 0 0}
.about-grid{display:grid; grid-template-columns:1fr 1fr; gap:0; margin-top:56px; border-top:2px solid var(--ink)}
.about-grid article{padding:32px 32px 8px 0}
.about-grid article + article{padding-left:32px; padding-right:0; border-left:1px solid var(--line)}
.about-grid h2{font-family:var(--display); font-size:clamp(24px,3vw,32px); line-height:1.15; letter-spacing:-.02em; margin:0 0 12px; font-weight:700}
.about-grid p{margin:0 0 14px; color:var(--muted); max-width:52ch}
.find{list-style:none; margin:56px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:12px}
.find a{display:inline-block; text-decoration:none; font-weight:600; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:12px 20px}
.find a:hover{border-color:var(--ink)}
[hidden]{display:none !important}

footer{margin-top:64px; border-top:1px solid var(--line); padding:32px 0 48px; color:var(--muted); font-size:15px}
footer .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
footer a{text-decoration:none; font-weight:500}
.manage-link{background:none; border:0; color:var(--muted); font:inherit; cursor:pointer; padding:0; text-decoration:underline}

/* manage mode */
.del{position:absolute; top:10px; right:10px; border:0; background:var(--ink); color:var(--paper); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1; display:none}
body.managing .del{display:block}
.tip,.gram{position:relative}
.add-bar{display:none; gap:10px; flex-wrap:wrap; margin:0 0 20px}
body.managing .add-bar{display:flex}
.add-bar button,.dlg button{font:600 15px var(--body); border-radius:999px; padding:10px 18px; cursor:pointer; border:1px solid var(--ink); background:var(--ink); color:var(--paper)}
.add-bar button.ghost,.dlg button.ghost{background:transparent; color:var(--ink)}
dialog.dlg{border:0; border-radius:20px; padding:28px; width:min(520px,92vw); background:var(--surface); color:var(--ink)}
dialog.dlg::backdrop{background:rgba(20,26,36,.5)}
.dlg h3{font-family:var(--display); font-size:24px; margin:0 0 16px}
.dlg label{display:block; font-size:14px; font-weight:600; margin:14px 0 6px}
.dlg input,.dlg textarea,.dlg select{width:100%; font:16px var(--body); padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.dlg textarea{min-height:130px; resize:vertical}
.dlg .row{display:flex; gap:10px; justify-content:flex-end; margin-top:22px}
.status{font-size:14px; color:var(--muted); margin-top:10px; min-height:1.2em}

@media (max-width:760px){
  nav.links{display:none}
  .home-logo img{width:42px; height:42px}
  .ig-name{font-size:16px}
  .hero-logo{max-width:200px}
  .about{padding-top:48px}
  .about-grid{grid-template-columns:1fr}
  .about-grid article,.about-grid article + article{padding:28px 0 8px; border-left:0}
  .about-grid article + article{border-top:1px solid var(--line)}
  .umbrella img{width:200px}
  .hero{grid-template-columns:1fr; padding:48px 0 40px}
  .hero-logo{justify-self:start; order:-1}
  .today{grid-template-columns:1fr}
  .today article,.today article + article{padding:28px 0; border-left:0}
  .today article + article{border-top:1px solid var(--line)}
  .tip,.tip.has-img{grid-template-columns:1fr; gap:6px}
  .tip .pic{order:-1; margin-bottom:8px}
  .grams{grid-template-columns:repeat(2,1fr)}
  section.block{padding-top:64px}
}
</style>
</head>

<main id="top" class="wrap">
<div id="page-home">
  <section class="hero">
    <div>
      <h1>Step back.<br>Let them climb.</h1>

    <h1 id="about-h">About us</h1>
    <p class="lede">Tiaras is our family's umbrella brand. Raise Independent Kids is one of its channels, made for parents who want capable, confident children.</p>
    <div class="about-grid">
      <article>
        <h2>Why Raise Independent Kids</h2>
        <p>Most of us are working parents in small, nuclear families, often with one child and no grandparents down the road. It is quicker to do everything for our children, so we do.</p>
        <p>We share one small idea a day to help children do more for themselves: packing their own bag, pouring their own water, solving their own problems. Little steps, taken early.</p>
      </article>
      <article>
        <h2>The Tiaras family</h2>
        <p>Under the Tiaras umbrella we create content, activities and products for parents and children, including Tiaras Universe, our home for play ideas, printables and gifts for curious kids.</p>
        <p>Every tip, reel and hack is something we would try in our own home first.</p>
      </article>
    </div>

<script id="app-script">
(function(){
  var root = document.body;

  var dataEl = document.getElementById('site-data');

  // capture authored source before rendering touches the DOM
  var SRC = {
    style: document.getElementById('app-style').textContent,
    shell: tpl.innerHTML,
    script: document.getElementById('app-script').textContent
  };

  var byDate = function(a,b){ return (b.date||'').localeCompare(a.date||''); };
  var fmtDate = function(d){ try { return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return d; } };
  var shownTips = 5;

  function render(){
    var tips = data.tips.slice().sort(byDate), hacks = data.hacks.slice().sort(byDate), grams = data.instagram.slice().sort(byDate);
    var t = tips[0], h = hacks[0];
    var pic = function(x){ return x && x.img ? '<img class="pic" src="'+esc(x.img)+'" alt="'+esc(x.alt||'')+'" loading="lazy">' : ''; };
    $('today-tip').innerHTML = t ? pic(t)+'<p class="kicker">Today’s tip, '+esc(fmtDate(t.date))+'</p><h2>'+esc(t.title)+'</h2><p>'+esc(t.body)+'</p>' : '<p class="kicker">Today’s tip</p><h2>A new tip is coming soon.</h2>';
    $('today-hack').innerHTML = h ? pic(h)+'<p class="kicker hack-k">Today’s hack</p><h2>'+esc(h.title)+'</h2><p>'+esc(h.body)+'</p>' : '<p class="kicker hack-k">Today’s hack</p><h2>A new hack is coming soon.</h2>';

    $('tip-list').innerHTML = tips.slice(0, shownTips).map(function(x){
      return '<li class="tip'+(x.img?' has-img':'')+'"><time datetime="'+esc(x.date)+'">'+esc(fmtDate(x.date))+'</time><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p></div>'+pic(x)+'<button class="del" data-del="tips:'+esc(x.id)+'" aria-label="Delete tip">×</button></li>';
    }).join('');
    $('more-tips').hidden = tips.length <= shownTips;

    $('hack-list').innerHTML = hacks.map(function(x){
      return '<article class="hack">'+pic(x)+'<h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p><time datetime="'+esc(x.date)+'">'+esc(fmtDate(x.date))+'</time><button class="del" data-del="hacks:'+esc(x.id)+'" aria-label="Delete hack">×</button></article>';
    }).join('');

    $('gram-list').innerHTML = grams.map(function(x){
      var url = /^https:\/\/(www\.)?instagram\.com\//.test(x.url||'') ? x.url : 'https://www.instagram.com/raiseindependentkids/';
      return '<a class="gram" href="'+esc(url)+'" target="_blank" rel="noopener"><span class="fmt">'+esc(x.fmt||'Post')+' · '+esc(fmtDate(x.date))+'</span><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p></div><button class="del" data-del="instagram:'+esc(x.id)+'" aria-label="Delete post">×</button></a>';
    }).join('');
  }
  function route(){
    var about = location.hash === '#about';
    $('page-home').hidden = about; $('page-about').hidden = !about;
    var a = document.querySelector('nav.links a[data-page="about"]'); if (a) { if (about) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }
    if (about) { window.scrollTo(0,0); return; }
    var id = location.hash.slice(1), el = id && id !== 'top' ? document.getElementById(id) : null;
    if (el) el.scrollIntoView(); else if (location.hash === '#top') window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  render();
  route();
  $('more-tips').addEventListener('click', function(){ shownTips += 10; render(); });

  // ---------- owner editing: the page republishes itself ----------

  $('manage-toggle').addEventListener('click', function(){
    var on = document.body.classList.toggle('managing');
    this.textContent = on ? 'Done managing' : 'Manage posts';
    if (on) document.getElementById('tips').scrollIntoView();
  });

  var dlg = $('dlg'), current = null;
  document.addEventListener('click', function(e){
    var add = e.target.closest('[data-add]');
    if (add) {
      current = add.getAttribute('data-add');
      $('dlg-title').textContent = current === 'tips' ? 'Add a daily tip' : current === 'hacks' ? 'Add a parenting hack' : 'Add an Instagram post';
      $('f-body-label').textContent = current === 'instagram' ? 'Caption' : current === 'tips' ? 'Tip (one paragraph)' : 'Hack (one or two lines)';
      $('ig-fields').hidden = current !== 'instagram';
      $('f-title').value = ''; $('f-body').value = ''; $('f-url').value = '';
      $('f-date').value = new Date().toISOString().slice(0,10);
      $('dlg-status').textContent = '';
      dlg.showModal(); $('f-title').focus();
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      e.preventDefault(); e.stopPropagation();
      var p = del.getAttribute('data-del').split(':');
      if (!confirm('Delete this item from the site?')) return;
      data[p[0]] = data[p[0]].filter(function(x){ return x.id !== p[1]; });
      render(); save(null);
    }
  }, true);
  $('dlg-cancel').addEventListener('click', function(){ dlg.close(); });
  $('dlg-save').addEventListener('click', function(){
    var title = $('f-title').value.trim(), body = $('f-body').value.trim(), date = $('f-date').value;
    if (!title || !body || !date) { $('dlg-status').textContent = 'Add a title, text and date to publish.'; return; }
    var item = {id: current[0] + Date.now().toString(36), date: date, title: title, body: body};
    if (current === 'instagram') {
      var u = $('f-url').value.trim();
      if (u && !/^https:\/\/(www\.)?instagram\.com\//.test(u)) { $('dlg-status').textContent = 'Paste a link that starts with https://www.instagram.com/'; return; }
      item.url = u; item.fmt = $('f-fmt').value;
    }
    data[current].push(item);
    render();
    save($('dlg-status'));
  });
})();
</script>
</body>
</html>
